<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Wellspring University</title>
  <link rel="icon" href="../assets/apple-touch-icon.png" type="image/x-icon">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-panel">
      <a class="auth-logo" href="../home.html" aria-label="Wellspring University home">
        <img src="../assets/logo.png" alt="Wellspring University logo">
      </a>
      <p class="eyebrow">Password reset</p>
      <h1>Forgot password</h1>
      <p class="muted">Enter your email address and Supabase will send a reset link.</p>
      <form id="forgotForm">
        <input type="email" id="email" placeholder="Email address" required>
        <button type="submit" class="btn primary">Send reset link</button>
      </form>
      <p id="authMessage" class="error"></p>
      <div class="auth-links">
        <a class="home-link" href="../home.html">Back to Home</a>
        <a href="login.html">Back to login</a>
      </div>
    </section>
  </main>
  <footer class="site-footer"><p>&copy; 2026 Excellence Oseagwina</p></footer>
  <script src="../js/auth.js"></script>
</body>
</html>
