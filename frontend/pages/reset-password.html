<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Wellspring University</title>
  <link rel="icon" href="../assets/apple-touch-icon.png" type="image/x-icon">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-panel">
      <a class="auth-logo" href="../home.html" aria-label="Wellspring University home">
        <img src="../assets/logo.png" alt="Wellspring University logo">
      </a>
      <p class="eyebrow">Password reset</p>
      <h1>Create new password</h1>
      <p class="muted">Enter a new password for your Wellspring Inventory account.</p>
      <form id="resetPasswordForm" novalidate>
        <input type="password" id="password" placeholder="New password" minlength="6" required>
        <p id="passwordError" class="field-error"></p>
        <input type="password" id="confirmPassword" placeholder="Confirm new password" minlength="6" required>
        <p id="confirmPasswordError" class="field-error"></p>
        <button type="submit" class="btn primary">Update password</button>
      </form>
      <p id="authMessage" class="error"></p>
      <div class="auth-links">
        <a class="home-link" href="../home.html">Back to Home</a>
        <a href="login.html">Back to login</a>
      </div>
    </section>
  </main>
  <footer class="site-footer"><p>&copy; 2026 Excellence Oseagwina</p></footer>
  <script src="../js/auth.js"></script>
</body>
</html>
