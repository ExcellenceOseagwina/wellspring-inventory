<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Wellspring University</title>
  <link rel="icon" href="../assets/apple-touch-icon.png" type="image/x-icon">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-panel">
      <a class="auth-logo" href="../home.html" aria-label="Wellspring University home">
        <img src="../assets/logo.png" alt="Wellspring University logo">
      </a>
      <p class="eyebrow">Sign in</p>
      <h1>Wellspring University</h1>
      <p class="muted">Access the inventory dashboard.</p>
      <form id="loginForm" novalidate>
        <input type="email" id="email" placeholder="Email address" required>
        <p id="emailError" class="field-error"></p>
        <input type="password" id="password" placeholder="Password" required>
        <p id="passwordError" class="field-error"></p>
        <button type="submit" class="btn primary">Login</button>
      </form>
      <p id="authMessage" class="error"></p>
      <div class="auth-links">
        <a class="home-link" href="../home.html">Back to Home</a>
        <a href="signup.html">Create account</a>
        <a href="forgot-password.html">Forgot password?</a>
      </div>
    </section>
  </main>
  <footer class="site-footer"><p>&copy; 2026 Excellence Oseagwina</p></footer>
  <script src="../js/api-base.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
