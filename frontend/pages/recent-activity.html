<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wellspring University - Recent Activity</title>
  <link rel="icon" href="../assets/apple-touch-icon.png" type="image/x-icon">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body onload="checkAuth()">
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-row">
        <a class="logo-link" href="../home.html" aria-label="Wellspring University home">
          <img src="../assets/logo.png" alt="Wellspring University logo">
        </a>
        <div class="brand">
          <h1>Recent Activity</h1>
          <p>Latest inventory records</p>
        </div>
      </div>
      <div class="auth-actions">
        <a class="btn secondary" href="dashboard.html">Dashboard</a>
        <a class="btn secondary" href="../home.html">Back to Home</a>
        <button class="btn secondary" onclick="logout()">Sign out</button>
      </div>
    </header>
    <main class="content">
      <p id="activityNotice" class="error"></p>
      <section class="section-head">
        <h2>Latest Activity</h2>
      </section>
      <section id="activityList" class="activity-list">
        <div class="notice">Loading recent activity...</div>
      </section>
    </main>
  </div>
  <footer class="site-footer"><p>&copy; 2026 Excellence Oseagwina</p></footer>
  <script src="../js/auth.js"></script>
  <script src="../js/activity.js"></script>
</body>
</html>
